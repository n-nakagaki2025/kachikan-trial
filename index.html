<style>
/* Layout: SQF体験版と同じ見た目の1カラム。カードは1枚ずつ、答えは縦に6つ並ぶ。 */
:root{
  --bg:#F5F4F8; --surface:#FFFFFF; --ink:#1F1B2A; --muted:#625C70; --line:#DDD9E5;
  --accent:#7A2E78; --accent-ink:#FFFFFF; --tint:#F3ECF3;
  --tE:#B4621A; --tA:#A9465E; --tC:#3F6B2A; --tN:#5E4A8C; --tO:#1F6E78;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17141E; --surface:#221E2B; --ink:#EEEAF4; --muted:#A79FB5; --line:#383244;
  --accent:#D58BD2; --accent-ink:#1A1520; --tint:#2C2333;
  --tE:#E59B55; --tA:#E58AA0; --tC:#94BF79; --tN:#B3A0E0; --tO:#6BBAC2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17141E; --surface:#221E2B; --ink:#EEEAF4; --muted:#A79FB5; --line:#383244;
  --accent:#D58BD2; --accent-ink:#1A1520; --tint:#2C2333;
  --tE:#E59B55; --tA:#E58AA0; --tC:#94BF79; --tN:#B3A0E0; --tO:#6BBAC2; color-scheme:dark}

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
button{font:inherit;cursor:pointer;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 28px;font-weight:700;font-size:16px;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.textbtn{background:none;border:0;padding:6px 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Intro */
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(28px,7vw,40px);font-weight:800}
.hero .lead{font-size:17px}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}
.facts b{font-family:var(--mono);color:var(--ink);font-weight:500}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.detail h3{font-size:19px}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px;font-size:15px}
.note{border-left:4px solid var(--accent);padding:2px 0 2px 14px;font-size:15px}
.resume{background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.resume h3{font-size:19px}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.pick .nm{font-family:var(--display);font-weight:800;font-size:18px;color:var(--tc)}
.pick .sub{font-size:12px;color:var(--muted)}
.pick:hover{border-color:var(--tc)}
.pick[aria-pressed="true"]{border-color:var(--ink)}

/* Question */
.progress{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 22px;display:flex;flex-direction:column;gap:10px;min-height:150px;justify-content:center}
.qcard .nm{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,34px);line-height:1.3}
.qcard .ds{font-size:17px}
.ask{font-size:15px;color:var(--muted)}
.likert{display:flex;flex-direction:column;gap:8px}
.lk{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;text-align:left;font-size:16px;font-weight:500;transition:border-color .15s,background .15s}
.lk .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.lk[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.lk[aria-pressed="true"] .dot{border-color:var(--accent)}
.lk[aria-pressed="true"] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.lk:hover{border-color:var(--accent)}
.qnav{display:flex;justify-content:space-between;align-items:center}

/* Result */
.sec{display:flex;flex-direction:column;gap:12px}
.sec > h2{font-size:22px}
.axis{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px}
.axis .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.axis .tn{font-family:var(--display);font-weight:800;font-size:19px;color:var(--tc)}
.axis .ln{font-size:14px;font-weight:700}
.track{position:relative;height:var(--th,22px)}
.track::before{content:"";position:absolute;left:0;right:0;bottom:10px;height:2px;background:var(--line)}
.track::after{content:"";position:absolute;left:50%;bottom:4px;width:2px;height:14px;background:var(--muted);transform:translateX(-1px)}
.track i{position:absolute;bottom:3px;width:16px;height:16px;border-radius:50%;background:var(--tc);border:2px solid var(--surface);transform:translateX(-8px);z-index:2}
.track b{position:absolute;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--tc);background:var(--surface);transform:translateX(-4.5px);z-index:1}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.facets{display:flex;flex-direction:column;gap:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.fr:first-child{border-top:0}
.fr .fn{grid-column:1/-1;font-size:13px;color:var(--muted)}
.fr .cd{font-size:14px;min-width:0}
.fr .cd b{font-weight:700}
.fr .cd.hi{text-align:right}
.fr .sc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.fr .fn{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ty{font-size:12px;font-weight:700;border-radius:999px;padding:0 10px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.ty.high,.ty.low{color:var(--tc);border-color:var(--tc)}
.ty.both{background:var(--tc);border-color:var(--tc);color:var(--surface)}
.ty.center{border-style:dashed}
.ty.mismatch{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.lanes{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.lane{display:grid;grid-template-columns:7.2em 1fr;align-items:center;gap:8px}
.lane .nm{font-size:13px;font-weight:700;line-height:1.35;min-width:0}
.trk{position:relative;height:22px}
.trk::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:var(--line);border-radius:1px}
.trk::after{content:"";position:absolute;left:50%;top:2px;width:2px;height:18px;background:var(--muted);transform:translateX(-1px)}
.trk .bar{position:absolute;top:8px;height:6px;background:var(--tc);border-radius:3px}
.trk .bar.no{opacity:.4}
.trk .pt{position:absolute;top:0;width:22px;height:22px;border-radius:50%;transform:translateX(-11px);display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-weight:500;background:var(--tc);color:var(--surface);border:2px solid var(--tc);z-index:1}
.trk .pt.no{background:var(--surface);color:var(--tc)}
.axhd{display:grid;grid-template-columns:7.2em 1fr;gap:8px;font-size:12px;color:var(--muted)}
.axhd span:last-child{display:flex;justify-content:space-between}
.flagtx{grid-column:1/-1;font-size:13px;color:var(--ink);background:var(--tint);border-radius:6px;padding:4px 10px}
.counts{font-size:13px;color:var(--muted)}
.counts p{margin:0}
.counts p + p{margin-top:6px}
.counts.habit{color:var(--ink);background:var(--tint);border-radius:6px;padding:6px 10px}
.style{font-size:14px}
details.tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px}
details.tr summary{cursor:pointer;padding:14px 0;font-family:var(--display);font-weight:800;font-size:18px;color:var(--tc);list-style:none;display:flex;justify-content:space-between;gap:8px}
details.tr summary::-webkit-details-marker{display:none}
details.tr summary::after{content:"＋";font-family:var(--body);color:var(--muted)}
details.tr[open] summary::after{content:"－"}
details.tr .body{padding-bottom:14px}
.stand{display:flex;flex-direction:column;gap:8px}
.st{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:0 10px 10px 0;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.st .nm{font-family:var(--display);font-weight:800;font-size:18px}
.st .sub{font-size:13px;color:var(--muted)}
.types{display:flex;flex-direction:column;gap:12px}
.ty1{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.ty1 .from{font-size:12px;color:var(--muted)}
.ty1 .nm{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.35;color:var(--tc)}
.ty1 p{margin:0}
.dh{font-size:15px;margin:14px 0 6px;color:var(--muted);font-family:var(--body)}
.sum1{background:var(--surface);border:2px solid var(--tc);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;margin-bottom:12px}
.sum1 .lb{font-size:12px;letter-spacing:.1em;color:var(--muted)}
.sum1 .nm{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.3;color:var(--tc)}
.sum1 p{margin:0}
.cov{background:var(--surface);border:2px solid var(--tc);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;font-size:15px;margin:12px 0}
.cov .lb{font-size:12px;letter-spacing:.1em;color:var(--muted)}
.cov .nm{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.3;color:var(--tc)}
.cov p{margin:0}
.cov .cv1{display:flex;flex-direction:column;gap:6px;background:var(--tint);border-radius:10px;padding:12px 14px}
.cov .cv1 .q,.cov .cv1 .by{font-size:13px;color:var(--muted)}
.cov .cv1 .q b,.cov .cv1 .by b{color:var(--tc)}
.cov .cv1 .act{font-weight:600}
.cov .lane .nm{font-family:inherit;font-size:13px;font-weight:700;line-height:1.35;color:var(--ink)}
.cov .cv1 .ty1 .nm{font-size:22px}
.cov .textbtn{align-self:flex-start}
.cov .mkopen{border:1.5px solid var(--tc);color:var(--tc);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;text-decoration:none;font-size:14px;margin-top:4px}
.mk{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.mkq{margin:4px 0 0;font-size:13px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;text-align:left;line-height:1.4;max-width:100%}
.chip:hover{border-color:var(--tc)}
.chip[aria-pressed="true"]{border-color:var(--tc);background:var(--tc);color:#fff}
.chip:disabled{opacity:.5}
.mine{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:2px solid var(--tc);border-radius:10px;padding:10px 12px}
.mine b{font-size:12px;color:var(--tc);letter-spacing:.08em}
.mine span{font-weight:700}
.next{display:flex;flex-direction:column;gap:12px}
.nx{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.nx h3{font-size:17px}
.nx p{margin:0}
.nx .chk{display:flex;align-items:center;gap:8px;font-size:14px}
.nx .chk input{width:18px;height:18px;accent-color:var(--accent)}
.callout{border-left:4px solid var(--accent);background:var(--surface);padding:14px 16px;border-radius:0 10px 10px 0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.callout h3{font-size:17px}
.onecard{background:var(--surface);border:2px solid var(--tc);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.onecard .lb{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.onecard .nm{font-family:var(--display);font-weight:800;font-size:28px;color:var(--tc);line-height:1.3}
.qs{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:16px}
.copied{font-size:13px;color:var(--accent)}
.tE{--tc:var(--tE)} .tA{--tc:var(--tA)} .tC{--tc:var(--tC)} .tN{--tc:var(--tN)} .tO{--tc:var(--tO)}
/* PDF（画面外で A4・96dpi に描いて画像化。いつも明るい配色） */
#report{position:fixed;left:-20000px;top:0;pointer-events:none}
.pg{--bg:#F5F4F8;--surface:#FFFFFF;--ink:#1F1B2A;--muted:#625C70;--line:#DDD9E5;--accent:#7A2E78;--accent-ink:#FFFFFF;--tint:#F3ECF3;
  --tE:#B4621A;--tA:#A9465E;--tC:#3F6B2A;--tN:#5E4A8C;--tO:#1F6E78;color-scheme:light;
  width:794px;height:1123px;background:#FFFFFF;color:var(--ink);font-family:var(--body);font-size:13px;line-height:1.7;
  padding:48px 56px 44px;display:flex;flex-direction:column;gap:14px;overflow:hidden;position:relative}
.pg .ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--accent);padding-bottom:8px;font-size:11px;color:var(--muted);letter-spacing:.08em}
.pg .ph b{color:var(--accent);font-size:12px}
.pg .pf{position:absolute;left:56px;right:56px;bottom:18px;display:flex;justify-content:space-between;gap:12px;font-size:9.5px;color:var(--muted)}
.pg .pbody,.pmeasure{display:flex;flex-direction:column;gap:14px}
.pmeasure{width:682px;font-size:13px;line-height:1.7;font-family:var(--body)}
.pg h1{font-size:30px;font-weight:800;line-height:1.3}
.pg h2{font-size:19px}
.pg .eb{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:700}
.pg .mu{color:var(--muted)}
@media (max-width:380px){.picker,.dirs{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const DATA = {"traits": [{"key": "E", "name": "外向性", "facets": ["親しみやすさ", "人の輪", "主導性", "活動量", "刺激を求める心", "明るさ"]}, {"key": "A", "name": "協調性", "facets": ["人を信じる心", "公正さ", "人助け", "争いを避ける姿勢", "謙虚さ", "共感"]}, {"key": "C", "name": "誠実性", "facets": ["やりこなす力", "整理整頓", "約束を守る心", "向上心", "自己管理", "思慮深さ"]}, {"key": "N", "name": "否定的情動性", "facets": ["心配しやすさ", "怒りやすさ", "落ち込みやすさ", "人目の気になりやすさ", "欲求の強さ", "動揺しやすさ"]}, {"key": "O", "name": "開放性", "facets": ["想像力", "芸術への関心", "感受性", "変化への好み", "知的な関心", "常識へのとらわれなさ"]}], "cards": [{"id": "E-L1", "name": "人と距離を置く", "desc": "人とは、近づきすぎない関係のほうが心地よい"}, {"id": "E-H1", "name": "人なつっこさ", "desc": "初めての人とも、すぐに打ち解ける"}, {"id": "E-L2", "name": "一人の時間", "desc": "人混みや大勢の場より、一人で過ごすほうが落ち着く"}, {"id": "E-H2", "name": "人の輪が好き", "desc": "大勢が集まる場で、いろいろな人と話すのが好き"}, {"id": "E-L3", "name": "控えめ", "desc": "だれかが先に立つのを待ち、その流れについていく"}, {"id": "E-H3", "name": "自己主張", "desc": "その場の進め方を、自分から決めて引っぱる"}, {"id": "E-L4", "name": "マイペース", "desc": "予定を詰めこまず、ゆったり過ごすのが好き"}, {"id": "E-H4", "name": "活力", "desc": "いつも何かしら動いていて、空いた時間にもあれこれやる"}, {"id": "E-L5", "name": "安全第一", "desc": "危なっかしいことや、強い刺激は避けたい"}, {"id": "E-H5", "name": "スリルを楽しむ", "desc": "ハラハラするような興奮や、冒険を求める"}, {"id": "E-L6", "name": "まじめ", "desc": "はしゃぐことは少なく、静かに楽しむ"}, {"id": "E-H6", "name": "陽気さ", "desc": "楽しさが周りに伝わるほど、明るく過ごす"}, {"id": "A-L1", "name": "疑ってかかる", "desc": "人の言うことを、そのまま信じることは少ない"}, {"id": "A-H1", "name": "信頼", "desc": "人はたいてい、善意で動いていると思う"}, {"id": "A-L2", "name": "人を操ろうとする", "desc": "自分の目的のために、人を思うように動かそうとする"}, {"id": "A-H2", "name": "裏表がない", "desc": "人を利用したり、ずるをしたりしない"}, {"id": "A-L3", "name": "自分優先", "desc": "人のことより、自分のやるべきことに時間を使う"}, {"id": "A-H3", "name": "人のために動く", "desc": "頼まれなくても、人の手伝いをする"}, {"id": "A-L4", "name": "負けん気", "desc": "人とぶつかっても引かず、言い返して張り合う"}, {"id": "A-H4", "name": "人に譲る", "desc": "言い争いになりそうなら、自分から引く"}, {"id": "A-L5", "name": "自負心", "desc": "自分は人より優れていると思い、それを口にもする"}, {"id": "A-H5", "name": "謙虚さ", "desc": "自分のことを、人より上だとは思わない"}, {"id": "A-L6", "name": "割り切り", "desc": "人の困りごとは、その人自身が解決するものだと考える"}, {"id": "A-H6", "name": "情に厚い", "desc": "自分より大変な境遇の人に、心を寄せる"}, {"id": "C-L1", "name": "自己評価が辛め", "desc": "自分の腕前に、まだ自信が持てない"}, {"id": "C-H1", "name": "やれる手応え", "desc": "任されたことは、たいていうまくこなせる"}, {"id": "C-L2", "name": "散らかっても気にしない", "desc": "物を出しっぱなしにしても、あまり気にならない"}, {"id": "C-H2", "name": "秩序", "desc": "物を元の場所に戻し、身の回りを片づけておく"}, {"id": "C-L3", "name": "義務感が薄い", "desc": "約束より、その時の事情に合わせることがある"}, {"id": "C-H3", "name": "筋を通す", "desc": "約束を守り、うそをつかない"}, {"id": "C-L4", "name": "野心が薄い", "desc": "仕事は、求められたぶんだけやれば十分だと思う"}, {"id": "C-H4", "name": "目標達成", "desc": "求められた以上のことをしようと、力を注ぐ"}, {"id": "C-L5", "name": "後回しにしがち", "desc": "やるべきことに取りかかるまで、時間がかかる"}, {"id": "C-H5", "name": "やり抜く", "desc": "立てた計画は、準備をして最後までやり通す"}, {"id": "C-L6", "name": "即興性", "desc": "よく考える前に、その場で決めて動く"}, {"id": "C-H6", "name": "熟慮", "desc": "決める前に、よく考える"}, {"id": "N-L1", "name": "リラックス", "desc": "先のことを、あまり心配しない"}, {"id": "N-H1", "name": "先を案じる", "desc": "先のことをあれこれ心配し、悪いほうを考えやすい"}, {"id": "N-L2", "name": "腹を立てにくい", "desc": "ちょっとしたことでは、イライラしない"}, {"id": "N-H2", "name": "沸点が低め", "desc": "思い通りにいかないと、すぐイライラする"}, {"id": "N-L3", "name": "くよくよしない", "desc": "自分のことを、おおむね好ましく思える"}, {"id": "N-H3", "name": "気分が沈みやすい", "desc": "気分が落ち込み、自分が嫌になりやすい"}, {"id": "N-L4", "name": "物おじしない", "desc": "人前や気まずい場面でも、気後れしない"}, {"id": "N-H4", "name": "人目に敏感", "desc": "人前に出ると緊張して、気後れしやすい"}, {"id": "N-L5", "name": "欲をこらえる", "desc": "誘惑があっても、ほどほどで止められる"}, {"id": "N-H5", "name": "欲求に動かされやすい", "desc": "食べすぎや買いすぎなど、つい度を越してしまう"}, {"id": "N-L6", "name": "平常心", "desc": "プレッシャーがかかっても、落ち着いて対処できる"}, {"id": "N-H6", "name": "傷つきやすい", "desc": "出来事が重なると、あわてて手に負えなく感じる"}, {"id": "O-L1", "name": "現実を見る", "desc": "空想にふけるより、目の前のことを考える"}, {"id": "O-H1", "name": "空想好き", "desc": "思いをめぐらせ、空想の世界にひたるのが好き"}, {"id": "O-L2", "name": "芸術に関心が薄い", "desc": "美術館や詩より、ほかのことに時間を使いたい"}, {"id": "O-H2", "name": "美的感受性", "desc": "人が見過ごすところにも、美しさを見つける"}, {"id": "O-L3", "name": "淡々としている", "desc": "自分の気持ちの動きを、あまり意識しない"}, {"id": "O-H3", "name": "感情の豊かさ", "desc": "うれしさや悲しさを、深く強く味わう"}, {"id": "O-L4", "name": "慣れ親しんだもの", "desc": "慣れたやり方を変えるのは、気が進まない"}, {"id": "O-H4", "name": "新しいもの好き", "desc": "いつも同じより、やり方を変えてみるのが好き"}, {"id": "O-L5", "name": "具体的思考", "desc": "難しい理屈や抽象的な話には、興味がわきにくい"}, {"id": "O-H5", "name": "知的好奇心", "desc": "難しい本や、抽象的な話を楽しめる"}, {"id": "O-L6", "name": "決まりに従う", "desc": "昔から受け継がれてきた慣習や考え方を大切にする"}, {"id": "O-H6", "name": "決まりにとらわれない", "desc": "正しいことは一つではないと考え、世の中の当たり前を問い直す"}], "readings": {"E1": {"high": {"name": "打ち解けるのが早い人", "text": "初対面でも親しみを込めて接し、相手の緊張をほどきます。周りからは「話しかけやすい人」と見られやすく、そのぶん頼まれごとや相談が集まりやすいところもあります。"}, "low": {"name": "距離を保って付き合う人", "text": "人とは一定の距離を置き、なれなれしくしません。落ち着いた、信頼できる人と見られやすい一方で、最初は「とっつきにくい」と思われることもあります。"}, "both": {"name": "親しみやすいが、一線は引く人", "text": "誰にでも感じよく接しますが、踏み込ませる範囲は自分で決めています。周りからは「話しやすいのに、本音が見えにくい」と映ることもあります。"}, "mismatch": {"name": "相手次第で距離が変わる人", "text": "決まった距離感を持たず、相手や場によって近くも遠くもなります。人との距離を、ふだんあまり意識していないのかもしれません。"}}, "E2": {"high": {"name": "人の中で元気になる人", "text": "大勢と交流することで元気が出ます。集まりを企画したり、人と人をつないだりする役が回ってきやすい一方で、一人の時間が続くと物足りなさを感じやすいところもあります。"}, "low": {"name": "一人の時間で充電する人", "text": "一人で過ごす時間で考えを整え、力を取り戻します。じっくり考える仕事で力を出しやすい一方で、大勢の場が続くと疲れが出やすいところもあります。"}, "both": {"name": "場と一人を行き来する人", "text": "大勢の場も楽しめますが、あとで一人の時間をとって回復しています。予定が詰まると、気づかないうちに消耗していることがあります。"}, "mismatch": {"name": "少人数がいちばんの人", "text": "大勢でも一人でもなく、気心の知れた数人といるときがいちばん楽なのかもしれません。"}}, "E3": {"high": {"name": "場を引っぱる人", "text": "自信をもって意見を言い、場を前に進めます。まとめ役を任されやすい一方で、周りが意見を言いにくくなっていても気づきにくいことがあります。"}, "low": {"name": "一歩引いて支える人", "text": "出しゃばらず、人の話を聞いて場を支えます。周りからは安心できる人と見られやすい一方で、考えを持っていても言わずに終わることがあります。"}, "both": {"name": "ここぞで前に出る人", "text": "ふだんは一歩引いていますが、大事な場面や得意なことでは、はっきり言います。周りからは「意外と言う人」と見られているかもしれません。"}, "mismatch": {"name": "役割で動く人", "text": "任されれば引っぱり、任されなければ支える。自分から前に出るかどうかを、立場や役割で決めているのかもしれません。"}}, "E4": {"high": {"name": "テンポよく動く人", "text": "エネルギッシュに、次々と動きます。周りを巻き込む勢いがある一方で、予定を詰めすぎて休むタイミングを逃しやすいところもあります。"}, "low": {"name": "自分のペースを守る人", "text": "あわてず、確かめながら動きます。落ち着いた仕事ぶりが信頼されやすい一方で、急かされる場面では力を出しにくいことがあります。"}, "both": {"name": "緩急の人", "text": "ゆっくりの時間と、一気に動く時間がはっきり分かれています。周りからは、ペースが読みにくいと思われているかもしれません。"}, "mismatch": {"name": "周りのテンポに合わせる人", "text": "自分のテンポより、仕事や周りのペースに合わせて動いているのかもしれません。今はそうせざるを得ない状況にいる可能性もあります。"}}, "E5": {"high": {"name": "刺激で目が覚める人", "text": "変化やスリルのある場面で力が出て、新しいことに真っ先に飛び込みます。その一方で、単調な日々が続くと退屈して集中が切れやすいところもあります。"}, "low": {"name": "安心の中で力を出す人", "text": "危ないことを避け、見通しの立つ道を選びます。周りからは堅実と見られやすい一方で、新しい機会に踏み出すまでに時間がかかることがあります。"}, "both": {"name": "計算してスリルを取る人", "text": "刺激は好きですが、安全を確かめてから踏み出します。大けがはしにくい一方で、準備に時間をかけるぶん、機会を逃すこともあります。"}, "mismatch": {"name": "刺激より中身で選ぶ人", "text": "スリルも安全も、判断の基準になっていないのかもしれません。面白いか、意味があるかで選んでいる可能性があります。"}}, "E6": {"high": {"name": "楽しさが顔に出る人", "text": "うれしさや楽しさが素直に表に出て、場を明るくします。周りからは親しみやすく見られる一方で、気持ちが顔に出るぶん、隠したいときに隠しにくいこともあります。"}, "low": {"name": "落ち着いて見える人", "text": "はしゃぐことが少なく、いつも落ち着いて見えます。頼りになる印象を与えやすい一方で、楽しんでいても周りに伝わりにくいことがあります。"}, "both": {"name": "ギャップのある人", "text": "ふだんは落ち着いて見えますが、楽しいときは素直に全開になります。周りはそのギャップに驚いているかもしれません。"}, "mismatch": {"name": "静かに味わう人", "text": "はしゃぎもしないし、かたくもない。うれしさを内側で味わっているか、出す場面を選んでいるのかもしれません。"}}, "A1": {"high": {"name": "人を信じてかかる人", "text": "相手の善意を前提に接するので、周りは安心して心を開きます。任せ上手と見られやすい一方で、相手の話を確かめずに受け入れてしまうことがあります。"}, "low": {"name": "確かめてから信じる人", "text": "話をうのみにせず、裏づけを確かめてから動きます。慎重で頼れる人と見られやすい一方で、相手から「信用されていない」と受け取られることがあります。"}, "both": {"name": "信じるが、確かめもする人", "text": "基本は人を信じつつ、大事なところでは確かめます。周りからは「人当たりはいいのに、しっかりしている」と見られているかもしれません。"}, "mismatch": {"name": "相手によって信じ方が変わる人", "text": "人を信じるかどうかを、決まった構えではなく、相手との関係で決めているのかもしれません。"}}, "A2": {"high": {"name": "正面から向き合う人", "text": "人を利用したり、ずるをしたりせず、正面から向き合います。信頼を集めやすい一方で、駆け引きが必要な場面では、損な役回りになりやすいところがあります。"}, "low": {"name": "相手を動かそうとする人", "text": "目的のために、相手の気持ちや状況を見て、働きかけ方を変えます。交渉や調整で力を出しやすい一方で、周りから本音を警戒されることがあります。"}, "both": {"name": "ずるはしないが、根回しはする人", "text": "ずるはしませんが、物事を進めるための根回しはします。周りからは「正直なのに、話の進め方も考えている」と見られているかもしれません。"}, "mismatch": {"name": "場面で進め方を選ぶ人", "text": "正面から行くか、手を回すかを、決まった考えではなく、その場の状況で選んでいるのかもしれません。"}}, "A3": {"high": {"name": "頼まれる前に手を貸す人", "text": "困っている人に気づくと、自然に手を貸します。頼りにされやすい一方で、自分のことが後回しになりやすいところがあります。"}, "low": {"name": "自分の持ち場に集中する人", "text": "人の用事より、自分のやるべきことに時間を使います。仕事が確実と見られやすい一方で、周りから「手を貸してくれない」と思われることがあります。"}, "both": {"name": "手は貸すが、無理はしない人", "text": "人の手伝いをしつつ、自分の時間も守ります。周りからは「面倒見がいいのに、抱えこまない人」と見られているかもしれません。"}, "mismatch": {"name": "求められれば動く人", "text": "自分から手伝うか、自分のことに集中するかを、頼まれたかどうかで決めているのかもしれません。"}}, "A4": {"high": {"name": "角を立てない人", "text": "言い争いになりそうなら、自分から引いて場を収めます。穏やかな人と見られやすい一方で、言いたいことを飲み込んで、あとでもやもやしやすいところがあります。"}, "low": {"name": "ぶつかっても引かない人", "text": "意見がぶつかっても引かず、はっきり言い返します。頼もしい人と見られやすい一方で、相手との関係がぎくしゃくすることがあります。"}, "both": {"name": "引くところと引かないところがある人", "text": "ふだんは譲りますが、ゆずれないことでは張り合います。周りからは「穏やかだけど、芯がある」と見られているかもしれません。"}, "mismatch": {"name": "争いの外に立つ人", "text": "譲るとも張り合うとも決めず、言い争いそのものに加わらないようにしているのかもしれません。"}}, "A5": {"high": {"name": "自分を大きく見せない人", "text": "自分のことを、人より上だとは思いません。親しみやすい人と見られやすい一方で、力があっても周りに伝わりにくいことがあります。"}, "low": {"name": "自信を口にする人", "text": "自分の力に自信があり、それを言葉にもします。頼れる人と見られやすい一方で、周りから「えらそう」と受け取られることがあります。"}, "both": {"name": "控えめだが、自信もある人", "text": "ふだんは控えめですが、得意なことには自信を持っています。周りからは「謙虚なのに、ここぞで頼れる」と見られているかもしれません。"}, "mismatch": {"name": "人と比べない人", "text": "自分を上とも下とも思わず、そもそも人と比べることに関心が薄いのかもしれません。"}}, "A6": {"high": {"name": "人の痛みに心を寄せる人", "text": "大変な境遇の人に、自然と心を寄せます。優しい人と見られやすい一方で、人の困りごとを抱えこんで、疲れやすいところがあります。"}, "low": {"name": "割り切って見る人", "text": "人の困りごとは、その人自身が向き合うものだと考えます。落ち着いた人と見られやすい一方で、周りから「冷たい」と受け取られることがあります。"}, "both": {"name": "寄り添うが、のみこまれない人", "text": "人の大変さに心を寄せながら、手を出しすぎないようにもしています。周りからは「優しいのに、ぶれない人」と見られているかもしれません。"}, "mismatch": {"name": "状況を見て関わる人", "text": "心を寄せるとも割り切るとも決めず、相手や状況を見てから関わり方を決めているのかもしれません。"}}}, "aspects": {"E": {"a": {"name": "人と楽しむ面", "facets": [1, 2, 6]}, "b": {"name": "前に出て動く面", "facets": [3, 4]}, "dir": {"high": "外向き", "low": "内向き"}}}, "summaries": {"E": {"habit_both": {"name": "どちらにもなれる人", "text": "外向性の6組のうち半分以上で、反対の2枚のどちらにも「当てはまる」と答えています。人と過ごすことも一人の時間も、前に出ることも引くことも、場面に応じて使い分けている人なのかもしれません。ただ、何にでも「当てはまる」と答えやすいくせが出ている可能性もあるため、それらの組は個別の型としては読んでいません。"}, "habit_mismatch": {"name": "外向性の物差しに収まらない人", "text": "外向性の6組のうち半分以上で、反対の2枚のどちらにも「当てはまらない」と答えています。人づきあいや活発さを、自分をとらえる物差しとして使っていないのかもしれません。ただ、何にでも「当てはまらない」と答えやすいくせが出ている可能性もあるため、それらの組は個別の型としては読んでいません。"}, "split_ab": {"name": "人と楽しむが、前には出ない人", "text": "人と親しく過ごし、楽しさを分かち合うことは好きですが、場を引っぱったり、次々と動き回ったりはしません。外向性には「人と楽しむ面」と「前に出て動く面」の2つがあることが知られていて（DeYoung et al., 2007）、あなたは前者がはっきり強く、後者ははっきり控えめです。周りからは、一緒にいて楽しいけれど、まとめ役には回らない人と見られているかもしれません。"}, "split_ba": {"name": "前に出て動くが、群れない人", "text": "場を引っぱり、テンポよく動きますが、人と群れたり、はしゃいだりはしません。外向性には「人と楽しむ面」と「前に出て動く面」の2つがあることが知られていて（DeYoung et al., 2007）、あなたは後者がはっきり強く、前者ははっきり控えめです。周りからは、頼りになるけれど、少し近寄りがたい人と見られているかもしれません。"}, "split_mixed": {"name": "外向き・内向きでは片づかない人", "text": "外向性の中で、はっきり外向きに答えた組と、はっきり内向きに答えた組が、どちらも2組以上あります。外向的か内向的か、というひとことでくくられると違和感をもちやすい人です。場面によって「社交的」とも「おとなしい」とも言われ、正反対の評価を受けることがあるかもしれません。"}, "uniform_high": {"name": "はっきり外向きの人", "text": "外向性の6組のうち4組以上がそろって外向きの側に寄り、内向きの側に寄った組はありません。外向きの面が、場面を選ばず自然に出てくる人です。周りからは、エネルギーのある人、場を明るくする人と見られやすい一方で、静かに一人で考える時間を後回しにしやすいところもあります。"}, "uniform_low": {"name": "はっきり内向きの人", "text": "外向性の6組のうち4組以上がそろって内向きの側に寄り、外向きの側に寄った組はありません。静かに、自分のペースで過ごすことを大切にする人です。周りからは、落ち着いた、思慮深い人と見られやすい一方で、自分から輪に入ったり前に出たりする場面では、人より多くのエネルギーを使っているかもしれません。"}, "lean_high": {"name": "どちらかといえば外向きの人", "text": "外向きの側に寄った組が多く、全体としてはやや外向きです。いつも外向きというより、得意な場面になると外向きの面が出てくる人です。"}, "lean_low": {"name": "どちらかといえば内向きの人", "text": "内向きの側に寄った組が多く、全体としてはやや内向きです。いつも内向きというより、ふだんは静かでも、必要な場面では外向きにもなれる人です。"}, "mixed": {"name": "面ごとに向きが違う人", "text": "外向きの側に寄った組と、内向きの側に寄った組の両方があり、全体としてはどちらにも寄っていません。どの面を見るかで印象が変わるので、相手によって「明るい人」とも「静かな人」とも思われているかもしれません。"}, "flat": {"name": "どちらにも偏らない人", "text": "全体として、外向き・内向きのどちらにも寄っていません。場面に合わせて、人の中にも一人の時間にも、無理なくなじめる人です。周りからは、どんな場にもなじむ人と見られやすい一方で、自分らしさを言葉にしにくいと感じることがあるかもしれません。"}}}, "covers": {"E": {"E1H": {"tradeoff": "頼まれごとや相談が集まりやすい", "by": [{"from": "E4L", "text": "頼まれたら、すぐ「はい」と言わず、「少し考えてから返事するね」と一言はさむ。それだけで、引き受けすぎを防げます。"}, {"from": "E3H", "text": "頼まれごとが重なったら、一つだけ「これは〇〇さんが詳しいよ」と人に回す。全部を一人で抱えずに済みます。"}]}, "E1L": {"tradeoff": "最初は「とっつきにくい」と思われることがある", "by": [{"from": "E6H", "text": "初めての人と話すとき、最初に一度だけ、にっこりする。それだけで、近寄りやすさが変わります。"}, {"from": "E3H", "text": "初めての人には、自分から先に名前を言う。相手が話しかけやすくなります。"}]}, "E2H": {"tradeoff": "一人の時間が続くと、物足りなくなりやすい", "by": [{"from": "E1H", "text": "一人の作業が続く日は、だれかに「おつかれさま」と一言送る。短いやりとりでも、元気が戻ります。"}, {"from": "E5H", "text": "いつもと違う道を通って帰る。小さな新しさで、気分が上がります。"}]}, "E2L": {"tradeoff": "大勢の場が続くと、疲れが出やすい", "by": [{"from": "E3H", "text": "集まりでは、飲み物を配る、写真を撮るなど、手を動かす役を一つ持つ。役があると、雑談に気をつかわずに済みます。"}, {"from": "E1H", "text": "大勢の場では、話しやすそうな一人のそばにいる。大勢を相手にしなくて済みます。"}, {"from": "E4L", "text": "集まりの前に、帰る時間を自分の中で決めておく。終わりが見えていると、疲れにくくなります。"}]}, "E3H": {"tradeoff": "周りが意見を言いにくくなっていても、気づきにくい", "by": [{"from": "E1H", "text": "話し合いの最後に、「〇〇さんはどう？」と一人にだけ聞く。出てこなかった声が聞けます。"}, {"from": "E2L", "text": "話し合いのあと、だれが話していなかったかを一人だけ思い出しておく。次に声をかけるきっかけになります。"}]}, "E3L": {"tradeoff": "考えを持っていても、言わずに終わることがある", "by": [{"from": "E1H", "text": "言いそびれたことは、あとで「さっきの話だけど」と、一人にだけ話す。1対1なら、自然に言えます。"}, {"from": "E2L", "text": "話し合いの前に、言いたいことを一つだけスマホにメモしておく。メモがあると、口に出しやすくなります。"}]}, "E4H": {"tradeoff": "予定を詰めすぎて、休むタイミングを逃しやすい", "by": [{"from": "E2L", "text": "予定表に「休み」も一つ書き込む。予定になっていれば、休むことも忘れません。"}, {"from": "E5L", "text": "新しい予定を入れる前に、「この週、大丈夫？」と一度だけ自分に聞く。詰めすぎを防げます。"}]}, "E4L": {"tradeoff": "急かされる場面では、力を出しにくい", "by": [{"from": "E3H", "text": "急ぎの仕事を頼まれたら、「いつまでに必要ですか」と先に聞く。期限が分かれば、段取りを自分で決められます。"}, {"from": "E1H", "text": "急かされたら、「どこまでできていれば大丈夫？」と気軽に聞く。必要な分が分かれば、余裕が生まれます。"}, {"from": "E5L", "text": "締め切りのある仕事は、最初の5分だけ早めに手をつけておく。見通しが立つと、慌てずに済みます。"}]}, "E5H": {"tradeoff": "単調な日々が続くと、集中が切れやすい", "by": [{"from": "E4H", "text": "単調な作業は、タイマーを15分にセットして、その間だけ集中する。終わりが見えると、続けやすくなります。"}, {"from": "E2H", "text": "単調な作業は、人のいる場所でやる。人の気配があるだけで、退屈が和らぎます。"}]}, "E5L": {"tradeoff": "新しい機会に踏み出すまでに、時間がかかりやすい", "by": [{"from": "E1H", "text": "新しいことは、やったことのある人に一つだけ質問する。様子が分かると、踏み出しやすくなります。"}, {"from": "E4H", "text": "新しいことは、「とりあえず5分だけ」やってみる。小さく始めれば、テンポのよさが生きます。"}, {"from": "E2H", "text": "新しいことは、だれか一人を誘って一緒にやる。一人より心強く始められます。"}]}, "E6H": {"tradeoff": "隠したいときにも、気持ちが顔に出やすい", "by": [{"from": "E4L", "text": "すぐに返事したくないときは、「ちょっと考えるね」と一言だけ言う。その場で決めずに済みます。"}, {"from": "E1L", "text": "気持ちを見せたくない場面では、いつもより少しだけ丁寧な言葉を使う。言葉が落ち着くと、表情も落ち着きます。"}]}, "E6L": {"tradeoff": "楽しんでいても、周りに伝わりにくい", "by": [{"from": "E3H", "text": "楽しかったら、「楽しかった」と一言、口に出す。言葉にすれば、ちゃんと伝わります。"}, {"from": "E1H", "text": "楽しかった集まりのあと、一人に「今日はありがとう」と送る。楽しかった気持ちが届きます。"}]}}, "A": {"A1H": {"tradeoff": "相手の話を、確かめずに受け入れてしまうことがある", "by": [{"from": "E4L", "text": "大事な頼みごとには、その場で返事をせず「少し考えるね」と一言はさむ。持ち帰るだけで、確かめる時間ができます。"}, {"from": "A6L", "text": "話を聞いたら、「これは相手の事情」と一度だけ切り分ける。気持ちに流されず、中身を見られます。"}]}, "A1L": {"tradeoff": "相手から「信用されていない」と受け取られることがある", "by": [{"from": "E1H", "text": "確かめたいときは、「念のため教えて」と笑顔で一言そえる。疑っているのではないと伝わります。"}, {"from": "A3H", "text": "確かめる前に、「手伝えることある？」と一言かける。味方だと伝わってからなら、確かめても角が立ちません。"}]}, "A2H": {"tradeoff": "駆け引きが必要な場面では、損な役回りになりやすい", "by": [{"from": "E3H", "text": "話し合いの前に、ゆずれないことを一つだけ決めておく。正直なまま、引くところと引かないところを分けられます。"}, {"from": "A4L", "text": "条件を出されたら、「ほかの案はありますか」と一つだけ聞き返す。正直さを保ったまま、損な役回りを避けられます。"}]}, "A2L": {"tradeoff": "周りから本音を警戒されることがある", "by": [{"from": "E1H", "text": "話を進める前に、「実はこうしたいんだ」とねらいを一言先に言う。ねらいが見えると、警戒されにくくなります。"}, {"from": "A5H", "text": "うまくいったら、「〇〇さんのおかげ」と一言そえる。手柄を分けると、信頼が残ります。"}]}, "A3H": {"tradeoff": "自分のことが後回しになりやすい", "by": [{"from": "E4L", "text": "手伝う前に、「これが終わったら手伝うね」と一言そえる。自分の用事を先に片づけられます。"}, {"from": "A6L", "text": "手を貸す前に、「本人がやれることか」を一度だけ考える。全部引き受けずに済みます。"}]}, "A3L": {"tradeoff": "周りから「手を貸してくれない」と思われることがある", "by": [{"from": "E1H", "text": "手が離せないときは、「今は無理だけど、あとで聞くね」と一言返す。断っても、冷たい印象が残りません。"}, {"from": "E4H", "text": "自分の仕事が終わった日は、「何か手伝う？」と一言だけ聞く。小さな一言でも、印象が変わります。"}]}, "A4H": {"tradeoff": "言いたいことを飲み込んで、あとでもやもやしやすい", "by": [{"from": "E2L", "text": "飲み込んだことは、その日のうちに3行だけメモに書く。気持ちが整い、次に言うかどうかを選べます。"}, {"from": "A5L", "text": "ゆずるときに、「今回はそれで」と一言そえる。いつも引くわけではないと伝わり、もやもやが残りにくくなります。"}]}, "A4L": {"tradeoff": "相手との関係がぎくしゃくすることがある", "by": [{"from": "A6H", "text": "言い返したあとで、「言いすぎたかも」と一言そえる。意見は保ったまま、関 /* 価値観カード：採点の仕組み（体験版・本編で共通）
   1枚の回答は 1〜6。下位特性の位置 = 高い側の点 − 低い側の点（−5〜+5）。
   特性の位置 = 6つの下位特性の位置の平均。平均と比べず、本人の中での傾向として返す。 */
const Core = (() => {
  const LIKERT = [
    { v: 1, label: "まったく当てはまらない" },
    { v: 2, label: "当てはまらない" },
    { v: 3, label: "あまり当てはまらない" },
    { v: 4, label: "やや当てはまる" },
    { v: 5, label: "当てはまる" },
    { v: 6, label: "とても当てはまる" },
  ];

  function prepare(data) {
    const byId = {};
    data.cards.forEach((c) => {
      const [t, s] = c.id.split("-");
      c.trait = t;
      c.side = s[0];          // "H" | "L"
      c.n = Number(s.slice(1)); // 1..6
      byId[c.id] = c;
    });
    const traitByKey = {};
    data.traits.forEach((t) => (traitByKey[t.key] = t));
    return { traits: data.traits, cards: data.cards, byId, traitByKey };
  }

  function facet(ans, t, n) {
    const h = ans[`${t}-H${n}`], l = ans[`${t}-L${n}`];
    if (h == null || l == null) return null;
    // 型：差が2以上なら寄っている側。差が小さいときは、2枚の合計で
    // 「両方の顔がある」（どちらも高い：ふれ幅が大きい）と「真ん中」（どちらの端でもない）を分ける
    const f = h - l, sum = h + l;
    let type;
    if (f >= 2) type = "high";
    else if (f <= -2) type = "low";
    else if (sum >= 9) type = "both";      // どちらも高い：場面で変わる、または同意しやすいくせ
    else if (sum <= 5) type = "mismatch";  // どちらも低い：言葉が合わない、場面がない、など
    // 線は真ん中（合計7）から左右対称（両方の顔は＋2以上、どちらの言葉も合わないは−2以下）。2枚とも3か4なら真ん中（2026-11-06）
    else type = "center";                  // 差が小さく合計も中くらい：どちらの端でもない
    const flag = type === "both" || type === "mismatch" ? type : null;
    return { t, n, h, l, f, sum, type, flag };
  }

  function trait(ans, t) {
    const fs = [];
    for (let n = 1; n <= 6; n++) {
      const x = facet(ans, t, n);
      if (x) fs.push(x);
    }
    if (fs.length < 6) return { t, facets: fs, mean: null };
    const mean = fs.reduce((s, x) => s + x.f, 0) / 6;
    // 6つの下位特性の位置のばらつき（標準偏差）。平均だけでは、両端に分かれた場合も真ん中に見えるため
    const sd = Math.sqrt(fs.reduce((s2, x) => s2 + (x.f - mean) ** 2, 0) / 6);
    const split = sd >= 2.5 && Math.abs(mean) < 2.5;
    return { t, facets: fs, mean: Math.round(mean * 100) / 100, sd: Math.round(sd * 100) / 100, split };
  }

  function lean(v, split) {
    if (v == null) return "";
    if (split) return "組によって分かれている";
    if (v >= 2.5) return "高い側に寄っている";
    if (v >= 1) return "やや高い側";
    if (v > -1) return "どちらにも寄っていない";
    if (v > -2.5) return "やや低い側";
    return "低い側に寄っている";
  }

  // 目立つ下位特性：大きく寄っているもの（|高−低|）と、矛盾を抱えるもの（2枚の合計が7からどれだけ離れているか）を
  // 同じ物差し（0〜5）で比べ、3以上のものを強い順に。同点なら矛盾を抱えるもの（両方の顔／どちらの言葉も合わない）を先に。
  function standouts(ans, traits, limit = 3) {
    const all = [];
    traits.forEach((tr) => {
      for (let n = 1; n <= 6; n++) {
        const x = facet(ans, tr.key, n);
        if (!x || x.type === "center") continue;
        const contra = x.type === "both" || x.type === "mismatch";
        const score = contra ? Math.abs(x.sum - 7) : Math.abs(x.f);
        if (score >= 3) all.push(Object.assign({}, x, { score, contra }));
      }
    });
    all.sort((a, b) => b.score - a.score || (b.contra - a.contra));
    return all.slice(0, limit);
  }

  // ワンランク上の一枚：選んだ特性・方向の6枚のうち、
  // 点がいちばん高いのに、まだ「当てはまる」(5) に届いていないカード
  function oneUp(ans, cards, t, side) {
    const pool = cards.filter((c) => c.trait === t && c.side === side && ans[c.id] != null);
    const below = pool.filter((c) => ans[c.id] < 5);
    if (!below.length) return { card: null, allDone: pool.length > 0 };
    let best = below[0];
    below.forEach((c) => {
      if (ans[c.id] > ans[best.id]) best = c;
    });
    return { card: best, score: ans[best.id], allDone: false };
  }

  function shuffle(arr) {
    const a = arr.slice();
    const rnd = (k) => {
      if (typeof crypto !== "undefined" && crypto.getRandomValues) {
        const u = new Uint32Array(1);
        crypto.getRandomValues(u);
        return u[0] % k;
      }
      return Math.floor(Math.random() * k);
    };
    for (let i = a.length - 1; i > 0; i--) {
      const j = rnd(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 答え方のくせ：全回答の平均が極端に高い／低いときに一言添える
  function answerStyle(ans, ids) {
    const vs = ids.map((id) => ans[id]).filter((v) => v != null);
    if (!vs.length) return null;
    const m = vs.reduce((s, v) => s + v, 0) / vs.length;
    if (m >= 4.5) return { m, kind: "yes" };
    if (m <= 2.5) return { m, kind: "no" };
    return { m, kind: null };
  }

  return { LIKERT, prepare, facet, trait, lean, standouts, oneUp, shuffle, answerStyle };
})();

}

if (!S.reasons) S.reasons = {};

  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
function resetAll() {

/* ---------- 出題の範囲 ---------- */
function scopeIds() {
  if (IS_TRIAL) return D.cards.filter((c) => c.trait === CONFIG.trialTrait).map((c) => c.id);
  return D.cards.map((c) => c.id);
}
function answeredCount() { return scopeIds().filter((id) => S.answers[id] != null).length; }
function done() { return answeredCount() === scopeIds().length; }
function startQueue() {
  const rest = scopeIds().filter((id) => S.answers[id] == null);
  S.queue = Core.shuffle(rest);
  S.pos = 0;
  save();
}

/* ---------- 画面：カード ---------- */
function viewQuestion() {
  const scope = new Set(scopeIds());
  if (!S.queue.every((id) => scope.has(id))) startQueue(); // 体験版と本編で保存を共有しているため
  if (S.pos >= S.queue.length) { if (done()) return viewResult(); startQueue(); }
  const id = S.queue[S.pos];
  const c = D.byId[id];
  const total = scopeIds().length;
  const doneN = answeredCount();
  const cur = S.answers[id];
  app.innerHTML = `
    <div class="progress"><span>${Math.min(doneN + 1, total)} / ${total}</span><div class="bar"><i style="width:${(doneN / total) * 100}%"></i></div></div>
    <article class="qcard" aria-label="カード">
      <div class="nm">${esc(c.name)}</div>
      <div class="ds">${esc(c.desc)}</div>
    </article>
    <p class="ask">ふだんの自分に、どのくらい当てはまりますか？</p>
    <div class="likert" role="group" aria-label="当てはまる度合い">
      ${Core.LIKERT.slice().reverse().map((o) => `<button class="lk" data-v="${o.v}" aria-pressed="${cur === o.v}"><span class="dot"></span>${o.label}</button>`).join("")}
    </div>
    <div class="qnav">
      <button class="textbtn" id="back" ${S.pos === 0 ? "hidden" : ""}>ひとつ前に戻る</button>
      <button class="textbtn" id="quit">中断する（回答は保存されます）</button>
    </div>`;
  let locked = false; // 次のカードへ移るまでの間の、二度押しを受け付けない
  app.querySelectorAll(".lk").forEach((b) => (b.onclick = () => {
    if (locked) return;
    locked = true;
    S.answers[id] = Number(b.dataset.v);
    app.querySelectorAll(".lk").forEach((x) => x.setAttribute("aria-pressed", x === b));
    S.pos += 1;
    save();
    setTimeout(() => (S.pos >= S.queue.length && done() ? viewResult() : viewQuestion()), 180);
  }));
  document.getElementById("back").onclick = () => {
    S.pos = Math.max(0, S.pos - 1);
    delete S.answers[S.queue[S.pos]];
    save();
    viewQuestion();
  };
  document.getElementById("quit").onclick = viewIntro;
  window.scrollTo(0, 0);
}

  return `<div class="cov t${tc}"${pdf ? "" : ` id="covbox"`}>${head}
    <p class="small">どの型にも、その良さの裏側に、つまずきやすい場面があります。補う一歩は、その場面を、あなたがすでに持っているもう一つの型の力で乗り切る一歩です。自分らしさを変えずに、打てる手がひとつ増えます。</p>
    ${list.map((c) => `<div class="cv1">

/* ---------- 1点動かすと変わる型（2026-11-07 試し） ----------
   カードを1枚だけ、1点動かすと型がどう変わるかを試す。本人の回答は書き換えない（SIM は画面の中だけ）。
   型が加わる動きも、型がなくなる動き（真ん中へ）も出す。型がある・ないに良い悪いはない（中垣さん、2026-11-07）。
   「どちらの言葉も合わない」になる動きだけは出さない。
   答え方の癖（両方の顔・どちらの言葉も合わないが3組以上）は、本人の実際の回答だけで決め、試しの中では判定し直さない。
   実際の回答ですでに両方の顔が3組以上なら、両方の顔になる動きは出さない（型として読まないため） */
let SIM = null; // { n, id, v }
function oneUpMoves(t) {
  const habit = habitOf(t), R = DATA.readings || {}, out = [], seen = new Set();
  const ok = (a, b) => a !== b && b !== "mismatch";
  for (const x of Core.trait(S.answers, t).facets) {
    const r = R[`${t}${x.n}`];
    if (!r) continue;
    // 上げる動きを先に、高い側のカードを先に見る（同じ型に届く動きが2つあれば、先のものを使う）
    for (const [side, dv] of [["H", 1], ["L", 1], ["H", -1], ["L", -1]]) {
      const id = `${t}-${side}${x.n}`, v = S.answers[id] + dv;
      if (v < 1 || v > 6) continue;
      const y = Core.facet(Object.assign({}, S.answers, { [id]: v }), t, x.n);
      if (!ok(x.type, y.type) || (y.type !== "center" && !r[y.type])) continue;
      if (y.type === "both" && habit.both) continue;
      const k = `${x.n}:${y.type}`;
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ n: x.n, id, from: S.answers[id], v, x, y, before: readingOf(x), after: y.type === "center" ? null : r[y.type] });
    }
  }
  return out;
}
function oneUpHTML(t, pdf = false) {
  const moves = oneUpMoves(t);
  const head = `<span class="lb">新たな自分へ</span><span class="nm">1点動かすと変わる型</span>`;
  if (!moves.length) return pdf ? "" : `<div class="cov t${t}">${head}
    <p>今回の答えでは、${esc(tname(t))}の12枚の中に、1点動かして変わる型はありませんでした。本編では、ほかの4つの特性からも探せます。</p></div>`;
  const cur = SIM && moves.find((m) => m.id === SIM.id && m.v === SIM.v);
  const card = (m) => {
    const hi = D.byId[`${t}-H${m.n}`], lo = D.byId[`${t}-L${m.n}`];
    const h = m.id.includes("-H") ? m.v : m.x.h, l = m.id.includes("-L") ? m.v : m.x.l;
    const lead = !m.after
      ? (m.before ? `今の<b>「${esc(m.before.name)}」</b>がなくなり、どちらにも寄らない形になります。` : `どちらにも寄らない形になります。`)
      : m.before
      ? `今の<b>「${esc(m.before.name)}」</b>が、<b>「${esc(m.after.name)}」</b>に変わります。`
      : `新しく<b>「${esc(m.after.name)}」</b>が加わります。`;
    const body = m.after
      ? `<div class="ty1 t${t}"><span class="nm">${esc(m.after.name)}</span><p>${esc(m.after.text)}</p></div>`
      : `<p>「${esc(hi.name)}」と「${esc(lo.name)}」が、同じくらいに当てはまる形です。</p>`;
    return `<div class="cv1">
      <span class="q">「${esc(D.byId[m.id].name)}」を ${m.from}点 → ${m.v}点にすると</span>
      <span class="act">${lead}</span>
      <div class="facets t${t}"><div class="lanes">${laneHTML(hi.name, h, false)}${laneHTML(lo.name, l, true)}</div></div>
      ${body}
      ${pdf ? "" : `<button class="textbtn" id="simReset">元に戻す（あなたの答えに戻る）</button>`}</div>`;
  };
  if (pdf) return cur ? `<div class="cov t${t}">${head}<p class="small">結果画面で、カードを1枚だけ1点動かして試した結果です。あなたの答えそのものではありません。</p>${card(cur)}</div>` : "";
  return `<div class="cov t${t}" id="oneup">${head}
    <p class="small">カードを1枚だけ、1点動かすと、型がどう変わるかを試せます。型が加わる動きも、型がなくなる動きもあります。どちらが良いということはありません。あなたの答えは書き換えません。</p>
    <div class="chips">${moves.map((m) => `<button class="chip" data-id="${m.id}" data-v="${m.v}" aria-pressed="${cur === m}">「${esc(D.byId[m.id].name)}」を1点${m.v > m.from ? "上げる" : "下げる"}</button>`).join("")}</div>
    ${cur ? card(cur) : `<p class="small muted">試したいカードを選んでください。</p>`}</div>`;
}
function bindOneUp(t) {
  const box = document.getElementById("oneup");
  if (!box) return;
  const redraw = () => { box.outerHTML = oneUpHTML(t); bindOneUp(t); };
  box.querySelectorAll(".chip").forEach((b) => b.onclick = () => {
    const same = SIM && SIM.id === b.dataset.id && SIM.v === Number(b.dataset.v);
    SIM = same ? null : { id: b.dataset.id, v: Number(b.dataset.v) };
    redraw();
  });
  const r = document.getElementById("simReset");
  if (r) r.onclick = () => { SIM = null; redraw(); };
}

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function offerPdf(pdf, name) {
  const blob = pdf.output("blob");
  const file = new File([blob], name, { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  const box = document.getElementById("pdfReady");
  box.innerHTML = `<div class="row">${canShare ? `<button class="btn" id="pdfShare">保存・送る</button>` : ""}<a class="btn ghost" href="${url}" target="_blank" rel="noopener">PDFを開く</a></div>
    <p class="small">${canShare ? "「保存・送る」を押して「“ファイル”に保存」を選ぶと、iPhoneに残せます。LINEやメールを選べば、そのまま送れます。" : "「PDFを開く」で表示したPDFは、画面の共有ボタンから保存や送信ができます。"}</p>`;
  const b = document.getElementById("pdfShare");
  if (b) b.onclick = async () => {
    try { await navigator.share({ files: [file], title: name.replace(/\.pdf$/, "") }); }
    catch (e) { if (!e || e.name !== "AbortError") document.getElementById("dlStatus").textContent = "共有画面を開けませんでした。「PDFを開く」からお試しください。"; }
  };
}

async function downloadPDF() {
  const btn = document.getElementById("dl"), st = document.getElementById("dlStatus");
  if (!window.html2canvas || !window.jspdf) { st.textContent = "PDFの作成機能を読み込めませんでした。通信の良い場所で、ページを再読み込みしてください。"; return; }
  btn.disabled = true; st.textContent = "PDFを作成しています…";
  let host = document.getElementById("report");
  if (!host) { host = document.createElement("div"); host.id = "report"; host.setAttribute("aria-hidden", "true"); document.body.appendChild(host); }
  try {
    // 1) 各ブロックの高さを測って、ページに詰める
    const blocks = reportBlocks();
    host.innerHTML = `<div class="pg" style="height:auto"><div class="pmeasure">${blocks.map((b) => `<div class="blk">${b}</div>`).join("")}</div></div>`;
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const hs = [...host.querySelectorAll(".blk")].map((e) => e.offsetHeight);
    const LIMIT = 1123 - 48 - 44 - 34 - 30, GAP = 14;
    const pages = []; let cur = [], used = 0;
    blocks.forEach((b, i) => {
      const h = hs[i] + (cur.length ? GAP : 0);
      if (cur.length && used + h > LIMIT) { pages.push(cur); cur = []; used = 0; }
      used += hs[i] + (cur.length ? GAP : 0); cur.push(b);
    });
    if (cur.length) pages.push(cur);
    const title = IS_TRIAL ? "価値観カード 体験版 結果" : "価値観カード 結果";
    host.innerHTML = pages.map((p, n) => `<div class="pg"><div class="ph"><b>${title}</b><span>${new Date().toLocaleDateString("ja-JP")}</span></div>
      <div class="pbody">${p.join("")}</div>
      <div class="pf"><span>©2026 桜梅桃李コンサルティング｜診断ではありません。カードはIPIP（Goldberg, 1999）の30の下位特性を参考にしたオリジナルです。</span><span>${n + 1} / ${pages.length}</span></div></div>`).join("");
    // 2) 1ページずつ画像にして PDF へ
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "pt", format: "a4", compress: true });
    const pgs = host.querySelectorAll(".pg");
    for (let n = 0; n < pgs.length; n++) {
      st.textContent = `PDFを作成しています…（${n + 1} / ${pgs.length}ページ）`;
      const cv = await html2canvas(pgs[n], { scale: 2, backgroundColor: "#FFFFFF", logging: false });
      if (n > 0) pdf.addPage();
      pdf.addImage(cv.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, 595.28, 841.89);
    }
    const fname2 = IS_TRIAL ? "価値観カード_体験版_結果.pdf" : "価値観カード_結果.pdf";
    if (IS_IOS) { offerPdf(pdf, fname2); st.textContent = "PDFができました。"; }
    else { pdf.save(fname2); st.textContent = "PDFを作成しました。"; }
  } catch (e) {
    st.textContent = "PDFを作成できませんでした。SafariやChromeで開き直すか、ページを再読み込みしてからお試しください。";
  } finally {
    btn.disabled = false; host.innerHTML = "";
  }
}
